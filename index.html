<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora de Preparación — Pidebot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      color: #1A1A1A;
    }

    /* Header badge */
    .brand-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
    }

    .brand-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #EB9827;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 800;
      font-size: 13px;
    }

    .brand-name {
      font-weight: 700;
      font-size: 15px;
      color: #003942;
      letter-spacing: 0.04em;
    }

    .brand-label {
      font-size: 32px;
      color: #6B7280;
      font-weight: 400;
    }

    /* Card */
    .card {
      background: #ffffff;
      border-radius: 16px;
      border: 1px solid #D1D5DB;
      box-shadow: 0 4px 6px rgba(0,0,0,0.07), 0 2px 4px rgba(0,0,0,0.06);
      padding: 2rem;
      width: 100%;
      max-width: 520px;
    }

    .card-header {
      margin-bottom: 1.5rem;
    }

    .card-header h1 {
      font-size: 20px;
      font-weight: 700;
      color: #003942;
      margin-bottom: 4px;
    }

    .card-header p {
      font-size: 13px;
      color: #6B7280;
    }

    /* Fields grid */
    .fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 1.25rem;
    }

    @media (max-width: 480px) {
      .fields { grid-template-columns: 1fr; }
    }

    .field-box {
      background: #F9FAFB;
      border: 1px solid #D1D5DB;
      border-radius: 12px;
      padding: 14px 16px;
      transition: border-color 0.15s;
    }
    .field-box:focus-within {
      border-color: #003942;
    }

    .field-label {
      font-size: 12px;
      font-weight: 500;
      color: #3B3B3B;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .field-label svg {
      width: 13px;
      height: 13px;
      color: #6B7280;
      flex-shrink: 0;
    }

    .field-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    /* Inputs — Pidebot style */
    input[type="time"],
    input[type="date"] {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 14px;
      height: 40px;
      padding: 0 12px;
      border: 1px solid #D1D5DB;
      border-radius: 8px;
      background: #ffffff;
      color: #1A1A1A;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      width: 100%;
    }

    input[type="time"]:focus,
    input[type="date"]:focus {
      border-color: #003942;
      box-shadow: 0 0 0 2px #E0F2F5, 0 0 0 4px #003942;
    }

    /* Quick day buttons */
    .quick-btns {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .quick-btn {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 11px;
      font-weight: 500;
      padding: 3px 12px;
      border: 1px solid #D1D5DB;
      border-radius: 20px;
      background: #ffffff;
      color: #6B7280;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .quick-btn:hover {
      border-color: #003942;
      color: #003942;
      background: #E0F2F5;
    }

    .quick-btn.active {
      background: #003942;
      color: #ffffff;
      border-color: #003942;
    }

    /* Divider */
    .divider {
      border: none;
      border-top: 1px solid #D1D5DB;
      margin: 1.25rem 0;
    }

    /* Result box */
    .result-box {
      background: #E0F2F5;
      border: 1px solid #B3D9DF;
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      transition: opacity 0.2s;
    }

    .result-box.error-state {
      opacity: 0.45;
    }

    .result-label {
      font-size: 11px;
      font-weight: 600;
      color: #007A8C;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }

    .result-values {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }

    .result-min {
      font-size: 32px;
      font-weight: 700;
      color: #003942;
      line-height: 1;
    }

    .result-unit {
      font-size: 14px;
      color: #007A8C;
    }

    .result-sep {
      font-size: 14px;
      color: #B3D9DF;
    }

    .result-hm {
      font-size: 15px;
      font-weight: 600;
      color: #005566;
    }

    /* Copy button — Pidebot outline style */
    .summary-box {
      display: none;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      background: #FDF3E1;
      border: 1px solid #F3BC6D;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #3B3B3B;
    }

    .summary-box.visible {
      display: flex;
    }

    .summary-box strong {
      color: #003942;
      font-weight: 600;
    }

    .copy-btn {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 13px;
      font-weight: 600;
      height: 44px;
      padding: 0 20px;
      border: 1.5px solid #003942;
      border-radius: 8px;
      background: transparent;
      color: #003942;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.15s;
    }

    .copy-btn:hover {
      background: #003942;
      color: #ffffff;
      transform: scale(1.03);
      box-shadow: 0 4px 14px rgba(0, 57, 66, 0.25);
    }

    .copy-btn:active {
      transform: scale(0.97);
    }

    .copy-btn svg { width: 14px; height: 14px; }

    /* Error message */
    .error-msg {
      display: none;
      font-size: 13px;
      color: #EF4444;
      margin-top: 10px;
      align-items: center;
      gap: 5px;
    }

    .error-msg.visible {
      display: flex;
    }

    .error-msg svg { width: 13px; height: 13px; flex-shrink: 0; }
  </style>
</head>

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"/><path d="M8 2v4M16 2v4M2 10h20"/>
          </svg>
          Llegó la orden
        </div>
        <input type="time" id="arrival-time" value="14:43" />
      </div>

      <!-- Entregar a las -->
      <div class="field-box">
        <div class="field-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
          </svg>
          Entregar a las
        </div>
        <input type="time" id="delivery-time" value="16:00" />
        <input type="date" id="delivery-date" style="margin-top:8px;" />
        <div class="quick-btns">
          <button class="quick-btn" onclick="setDay(0)">Hoy</button>
          <button class="quick-btn active" onclick="setDay(1)">Mañana</button>
        </div>
      </div>
    </div>

    <hr class="divider" />

    <div class="result-box" id="result-card">
      <div>
        <div class="result-label">Tiempo de preparación</div>
        <div class="result-values">
          <span class="result-min" id="result-min">1,517</span>
          <span class="result-unit">min</span>
          <span class="result-sep">·</span>
          <span class="result-hm" id="result-hm">25h 17min</span>
        </div>
      </div>
      <button class="copy-btn" id="copy-btn" onclick="copyResult()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
        Copiar
      </button>
    </div>

    <div class="error-msg" id="error-msg">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      La hora de entrega debe ser posterior a la llegada.
    </div>

    <div class="summary-box" id="summary-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;flex-shrink:0;color:#007A8C;">
        <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
      </svg>
      <span id="summary-text">El cliente recibirá su pedido <strong id="s-day"></strong> a las <strong id="s-time"></strong>.</span>
    </div>
  </div>

  <script>
    function formatDate(date) {
      var y = date.getFullYear();
      var m = String(date.getMonth() + 1).padStart(2, '0');
      var d = String(date.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + d;
    }

    function setDay(offset) {
      var d = new Date();
      d.setDate(d.getDate() + offset);
      document.getElementById('delivery-date').value = formatDate(d);
      document.querySelectorAll('.quick-btn').forEach(function(b, i) {
        b.classList.toggle('active', i === offset);
      });
      calc();
    }

    function calc() {
      var aTime = document.getElementById('arrival-time').value;
      var dTime = document.getElementById('delivery-time').value;
      var dDate = document.getElementById('delivery-date').value;

      if (!aTime || !dTime || !dDate) return;

      var now = new Date();
      var aParts = aTime.split(':').map(Number);
      var dParts = dTime.split(':').map(Number);
      var dDateParts = dDate.split('-').map(Number);

      var arrival = new Date(now.getFullYear(), now.getMonth(), now.getDate(), aParts[0], aParts[1], 0, 0);
      var delivery = new Date(dDateParts[0], dDateParts[1] - 1, dDateParts[2], dParts[0], dParts[1], 0, 0);

      var diffMs = delivery - arrival;
      var errEl = document.getElementById('error-msg');
      var resCard = document.getElementById('result-card');

      if (diffMs <= 0) {
        errEl.classList.add('visible');
        resCard.classList.add('error-state');
        document.getElementById('summary-box').classList.remove('visible');
        return;
      }

      errEl.classList.remove('visible');
      resCard.classList.remove('error-state');

      var totalMin = Math.round(diffMs / 60000);
      var h = Math.floor(totalMin / 60);
      var m = totalMin % 60;

      document.getElementById('result-min').textContent = totalMin.toLocaleString('es-DO');
      document.getElementById('result-hm').textContent = h > 0 ? (h + 'h ' + m + 'min') : (m + 'min');

      // Summary
      var days = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
      var months = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
      var dayName = days[delivery.getDay()];
      var dayNum = delivery.getDate();
      var monthName = months[delivery.getMonth()];
      var hh = String(dParts[0]).padStart(2,'0');
      var mm = String(dParts[1]).padStart(2,'0');
      var ampm = dParts[0] < 12 ? 'AM' : 'PM';
      var h12 = dParts[0] % 12 || 12;
      var now2 = new Date();
      var isToday = delivery.toDateString() === now2.toDateString();
      var isTomorrow = (function(){ var t = new Date(now2); t.setDate(t.getDate()+1); return delivery.toDateString() === t.toDateString(); })();
      var dayLabel = isToday ? 'hoy' : (isTomorrow ? 'mañana (' + dayName + ' ' + dayNum + ' de ' + monthName + ')' : dayName + ' ' + dayNum + ' de ' + monthName);

      document.getElementById('s-day').textContent = dayLabel;
      document.getElementById('s-time').textContent = h12 + ':' + String(dParts[1]).padStart(2,'0') + ' ' + ampm;
      document.getElementById('summary-box').classList.add('visible');
    }

    function copyResult() {
      var raw = document.getElementById('result-min').textContent.replace(/[^0-9]/g, '');
      if (navigator.clipboard) {
        navigator.clipboard.writeText(raw).then(showCopied);
      } else {
        var ta = document.createElement('textarea');
        ta.value = raw;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showCopied();
      }
    }

    function showCopied() {
      var btn = document.getElementById('copy-btn');
      btn.style.background = '#003942';
      btn.style.color = '#ffffff';
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Copiado';
      setTimeout(function() {
        btn.style.background = '';
        btn.style.color = '';
        btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copiar';
      }, 2000);
    }

    ['arrival-time', 'delivery-time', 'delivery-date'].forEach(function(id) {
      document.getElementById(id).addEventListener('change', function() {
        document.querySelectorAll('.quick-btn').forEach(function(b) { b.classList.remove('active'); });
        calc();
      });
    });

    setDay(1);
    calc();
  </script>
</body>
</html>
